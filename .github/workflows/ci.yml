name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Express ships no linter; the TypeScript check is the lint step.
      - run: npm run typecheck
      - run: npm test
      - name: Typecheck e2e
        working-directory: e2e
        run: |
          npm install
          npm run typecheck
